<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadcopter Physics Simulator</title>
  </head>
  <body>
    <canvas id="renderCanvas" tabindex="0"></canvas>
    <aside id="hud" aria-live="polite">Initializing…</aside>
    <div id="controls">
      <button type="button" id="mode-free" aria-pressed="true">Free Physics</button>
      <button type="button" id="mode-hover" aria-pressed="false">Hover Test</button>
      <button type="button" id="mode-stabilized" aria-pressed="false">Stabilized Hover</button>
      <button type="button" id="reset-hover">Reset Hover Test</button>
      <button type="button" id="reset-stabilized">Reset Stabilized Hover</button>
      <button type="button" id="mode-camera" aria-pressed="true">Camera mode</button>
      <button type="button" id="mode-impact" aria-pressed="false">Impact mode</button>
      <button type="button" id="mode-grab" aria-pressed="false">Grab mode</button>
      <button type="button" id="impulse-up">Impulse +Y (Space)</button>
      <button type="button" id="impulse-x">Impulse +X (F)</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
